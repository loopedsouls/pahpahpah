<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Shader Mask - Máscara psicodélica com efeitos -->
  <defs>
    <linearGradient id="psychedelic1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="colorBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FF00FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0.4" />
    </radialGradient>
  </defs>
  
  <!-- Aura psicodélica -->
  <ellipse cx="12" cy="12" rx="11" ry="10" fill="url(#colorBurst)" opacity="0.3"/>
  
  <!-- Base da máscara -->
  <path d="M 4 12 Q 4 6 12 6 Q 20 6 20 12 Q 20 16 16 18 Q 12 20 8 18 Q 4 16 4 12 Z" 
        fill="url(#psychedelic1)" stroke="#FF00FF" stroke-width="0.8"/>
  
  <!-- Ondas distorcidas -->
  <path d="M 5 10 Q 7 9 9 10 Q 11 11 13 10 Q 15 9 17 10 Q 19 11 20 10" 
        fill="none" stroke="#00FFFF" stroke-width="0.6" opacity="0.7"/>
  <path d="M 5 14 Q 7 15 9 14 Q 11 13 13 14 Q 15 15 17 14 Q 19 13 20 14" 
        fill="none" stroke="#FFFF00" stroke-width="0.6" opacity="0.7"/>
  
  <!-- Olhos caleidoscópicos -->
  <ellipse cx="9" cy="11" rx="2.5" ry="3" fill="#000000" stroke="#00FFFF" stroke-width="0.6"/>
  <ellipse cx="15" cy="11" rx="2.5" ry="3" fill="#000000" stroke="#FFFF00" stroke-width="0.6"/>
  
  <!-- Espirais nos olhos -->
  <circle cx="9" cy="11" r="1.5" fill="none" stroke="#FF00FF" stroke-width="0.3" opacity="0.8"/>
  <circle cx="15" cy="11" r="1.5" fill="none" stroke="#00FFFF" stroke-width="0.3" opacity="0.8"/>
  
  <!-- Partículas coloridas -->
  <circle cx="6" cy="8" r="0.6" fill="#FFFF00" opacity="0.8"/>
  <circle cx="18" cy="8" r="0.6" fill="#FF00FF" opacity="0.8"/>
  <circle cx="7" cy="16" r="0.5" fill="#00FFFF" opacity="0.8"/>
  <circle cx="17" cy="16" r="0.5" fill="#FFFF00" opacity="0.8"/>
  
  <!-- Linhas de movimento -->
  <line x1="4" y1="12" x2="6" y2="12" stroke="#FFFFFF" stroke-width="0.4" opacity="0.6"/>
  <line x1="18" y1="12" x2="20" y2="12" stroke="#FFFFFF" stroke-width="0.4" opacity="0.6"/>
  <line x1="12" y1="5" x2="12" y2="7" stroke="#FFFFFF" stroke-width="0.4" opacity="0.6"/>
  
  <!-- Símbolo de slow-motion -->
  <text x="10" y="17" font-size="3" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" opacity="0.7">≈</text>
</svg>
