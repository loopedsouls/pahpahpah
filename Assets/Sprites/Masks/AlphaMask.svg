<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Alpha Mask - Máscara translúcida com gradiente -->
  <defs>
    <linearGradient id="alphaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#CC00FF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#9900CC;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF00FF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Aura fantasma -->
  <ellipse cx="12" cy="12" rx="11" ry="10" fill="url(#ghostGlow)" opacity="0.5"/>
  
  <!-- Base da máscara translúcida -->
  <path d="M 4 12 Q 4 6 12 6 Q 20 6 20 12 Q 20 16 16 18 Q 12 20 8 18 Q 4 16 4 12 Z" 
        fill="url(#alphaGradient)" stroke="#AA00CC" stroke-width="0.8" opacity="0.85"/>
  
  <!-- Camadas de transparência -->
  <path d="M 6 12 Q 6 8 12 8 Q 18 8 18 12 Q 18 15 14 16.5 Q 12 17.5 10 16.5 Q 6 15 6 12 Z" 
        fill="none" stroke="#FF66FF" stroke-width="0.4" opacity="0.6"/>
  
  <!-- Olhos fantasmagóricos -->
  <ellipse cx="9" cy="11" rx="2.5" ry="3" fill="#330033" stroke="#FF00FF" stroke-width="0.5" opacity="0.7"/>
  <ellipse cx="15" cy="11" rx="2.5" ry="3" fill="#330033" stroke="#FF00FF" stroke-width="0.5" opacity="0.7"/>
  
  <!-- Brilho interior dos olhos -->
  <ellipse cx="8.5" cy="10.5" rx="1" ry="1.5" fill="#FF66FF" opacity="0.8"/>
  <ellipse cx="14.5" cy="10.5" rx="1" ry="1.5" fill="#FF66FF" opacity="0.8"/>
  
  <!-- Símbolo alpha (α) -->
  <text x="10" y="17" font-size="4" fill="#FFFFFF" font-family="serif" font-style="italic" opacity="0.8">α</text>
  
  <!-- Partículas fantasmas -->
  <circle cx="5" cy="10" r="0.5" fill="#FF00FF" opacity="0.6"/>
  <circle cx="19" cy="10" r="0.5" fill="#FF00FF" opacity="0.6"/>
  <circle cx="7" cy="7" r="0.4" fill="#CC00FF" opacity="0.5"/>
  <circle cx="17" cy="7" r="0.4" fill="#CC00FF" opacity="0.5"/>
</svg>
