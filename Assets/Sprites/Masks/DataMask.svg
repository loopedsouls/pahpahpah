<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Data Mask - Máscara com criptografia -->
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00AAAA;stop-opacity:1" />
    </linearGradient>
    <pattern id="encryption" x="0" y="0" width="6" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="#004444" stroke-width="0.3" opacity="0.6"/>
      <circle cx="4.5" cy="1.5" r="0.4" fill="#004444" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Base da máscara -->
  <path d="M 4 12 Q 4 6 12 6 Q 20 6 20 12 Q 20 16 16 18 Q 12 20 8 18 Q 4 16 4 12 Z" 
        fill="url(#cyanGradient)" stroke="#008888" stroke-width="0.8"/>
  
  <!-- Padrão de criptografia -->
  <rect x="4" y="6" width="16" height="12" fill="url(#encryption)" opacity="0.7"/>
  
  <!-- Olhos -->
  <ellipse cx="9" cy="11" rx="2.5" ry="3" fill="#003333" stroke="#006666" stroke-width="0.5"/>
  <ellipse cx="15" cy="11" rx="2.5" ry="3" fill="#003333" stroke="#006666" stroke-width="0.5"/>
  
  <!-- Código hexadecimal -->
  <text x="6" y="9" font-size="1.8" fill="#004444" font-family="monospace" font-weight="bold">0x</text>
  <text x="11" y="16" font-size="1.8" fill="#004444" font-family="monospace" font-weight="bold">A3</text>
  <text x="15" y="9" font-size="1.8" fill="#004444" font-family="monospace" font-weight="bold">F7</text>
  
  <!-- Circuitos digitais -->
  <path d="M 5 14 L 7 14 L 8 13 L 9 14 L 11 14" fill="none" stroke="#004444" stroke-width="0.4" opacity="0.7"/>
  <path d="M 13 14 L 15 14 L 16 13 L 17 14 L 19 14" fill="none" stroke="#004444" stroke-width="0.4" opacity="0.7"/>
  <circle cx="7" cy="14" r="0.5" fill="#00FFFF" opacity="0.8"/>
  <circle cx="17" cy="14" r="0.5" fill="#00FFFF" opacity="0.8"/>
  
  <!-- Brilho tech -->
  <line x1="6" y1="8" x2="9" y2="8" stroke="#66FFFF" stroke-width="0.5" opacity="0.5"/>
  <line x1="15" y1="8" x2="18" y2="8" stroke="#66FFFF" stroke-width="0.5" opacity="0.5"/>
</svg>
