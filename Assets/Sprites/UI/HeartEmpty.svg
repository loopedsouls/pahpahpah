<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Coração Vazio -->
  <defs>
    <linearGradient id="emptyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Formato do coração (apenas contorno) -->
  <path d="M 8 14 Q 2 10 2 6 Q 2 3 4.5 3 Q 6 3 8 5 Q 10 3 11.5 3 Q 14 3 14 6 Q 14 10 8 14 Z" 
        fill="url(#emptyGradient)" stroke="#222222" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Contorno mais escuro -->
  <path d="M 8 13.5 Q 2.5 9.8 2.5 6.2 Q 2.5 3.5 4.5 3.5 Q 6 3.5 8 5.5 Q 10 3.5 11.5 3.5 Q 13.5 3.5 13.5 6.2 Q 13.5 9.8 8 13.5 Z" 
        fill="none" stroke="#555555" stroke-width="1" opacity="0.6"/>
  
  <!-- Interior vazio com linhas cruzadas -->
  <line x1="4" y1="6" x2="7" y2="11" stroke="#444444" stroke-width="0.3" opacity="0.4"/>
  <line x1="12" y1="6" x2="9" y2="11" stroke="#444444" stroke-width="0.3" opacity="0.4"/>
  <line x1="5" y1="8" x2="8" y2="12" stroke="#444444" stroke-width="0.3" opacity="0.4"/>
  <line x1="11" y1="8" x2="8" y2="12" stroke="#444444" stroke-width="0.3" opacity="0.4"/>
</svg>
