<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Shooter Enemy - Atirador com chapéu de chef -->
  <defs>
    <linearGradient id="orangeShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9944;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DD7722;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corpo laranja -->
  <rect x="7" y="11" width="10" height="10" fill="url(#orangeShirt)" stroke="#BB5511" stroke-width="0.5"/>
  
  <!-- Cabeça -->
  <circle cx="12" cy="8" r="4" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  
  <!-- Chapéu de chef -->
  <ellipse cx="12" cy="4" rx="5" ry="2" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="0.5"/>
  <rect x="9" y="4" width="6" height="3" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="0.5"/>
  <ellipse cx="12" cy="2.5" rx="3.5" ry="2" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="0.5"/>
  
  <!-- Olhos focados -->
  <circle cx="10.5" cy="8" r="0.7" fill="#000000"/>
  <circle cx="13.5" cy="8" r="0.7" fill="#000000"/>
  <line x1="9.5" y1="7" x2="11" y2="7.5" stroke="#000000" stroke-width="0.4"/>
  <line x1="14.5" y1="7" x2="13" y2="7.5" stroke="#000000" stroke-width="0.4"/>
  
  <!-- Boca séria -->
  <line x1="10" y1="10" x2="14" y2="10" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Braços com posição de atirador -->
  <rect x="4" y="12" width="3" height="7" rx="1" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5" transform="rotate(-20 5.5 15.5)"/>
  <rect x="17" y="12" width="3" height="7" rx="1" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5" transform="rotate(20 18.5 15.5)"/>
  
  <!-- Pernas -->
  <rect x="8" y="20" width="3" height="3" fill="#553311" stroke="#332211" stroke-width="0.5"/>
  <rect x="13" y="20" width="3" height="3" fill="#553311" stroke="#332211" stroke-width="0.5"/>
</svg>
