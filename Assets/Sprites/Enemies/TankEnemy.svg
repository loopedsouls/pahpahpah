<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Tank Enemy - Grandão com avental reforçado -->
  <defs>
    <linearGradient id="darkRedShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#AA3333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#771111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thickApron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#AAAAAA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#777777;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corpo largo e forte -->
  <rect x="6" y="11" width="12" height="10" fill="url(#darkRedShirt)" stroke="#551111" stroke-width="0.8"/>
  
  <!-- Avental reforçado metálico -->
  <path d="M 7 12 L 7 21 L 17 21 L 17 12 L 15 10 L 9 10 Z" fill="url(#thickApron)" stroke="#555555" stroke-width="0.8"/>
  <line x1="9" y1="13" x2="15" y2="13" stroke="#555555" stroke-width="0.5"/>
  <line x1="9" y1="16" x2="15" y2="16" stroke="#555555" stroke-width="0.5"/>
  <line x1="9" y1="19" x2="15" y2="19" stroke="#555555" stroke-width="0.5"/>
  
  <!-- Cabeça grande -->
  <circle cx="12" cy="7" r="4.5" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.6"/>
  
  <!-- Cabelo -->
  <ellipse cx="12" cy="4" rx="4.5" ry="2.5" fill="#2A1810"/>
  
  <!-- Olhos intimidadores -->
  <circle cx="10" cy="7" r="1" fill="#000000"/>
  <circle cx="14" cy="7" r="1" fill="#000000"/>
  <line x1="8.5" y1="6" x2="10" y2="6.5" stroke="#000000" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="15.5" y1="6" x2="14" y2="6.5" stroke="#000000" stroke-width="0.6" stroke-linecap="round"/>
  
  <!-- Boca fechada determinada -->
  <line x1="9" y1="9.5" x2="15" y2="9.5" stroke="#000000" stroke-width="0.7" stroke-linecap="round"/>
  
  <!-- Braços grossos -->
  <rect x="3" y="12" width="4" height="8" rx="1.5" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.6"/>
  <rect x="17" y="12" width="4" height="8" rx="1.5" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.6"/>
  
  <!-- Pernas grossas -->
  <rect x="7" y="20" width="4" height="3" fill="#222222" stroke="#000000" stroke-width="0.6"/>
  <rect x="13" y="20" width="4" height="3" fill="#222222" stroke="#000000" stroke-width="0.6"/>
</svg>
