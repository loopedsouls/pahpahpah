<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Basic Enemy - Competidor comum -->
  <defs>
    <linearGradient id="redShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC2222;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corpo vermelho -->
  <rect x="7" y="10" width="10" height="11" fill="url(#redShirt)" stroke="#AA1111" stroke-width="0.5"/>
  
  <!-- Cabeça -->
  <circle cx="12" cy="7" r="4" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  
  <!-- Cabelo -->
  <ellipse cx="12" cy="4.5" rx="4" ry="2.5" fill="#6B4423"/>
  
  <!-- Olhos agressivos -->
  <line x1="10" y1="6.5" x2="11" y2="7.5" stroke="#000000" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="14" y1="6.5" x2="13" y2="7.5" stroke="#000000" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Boca raivosa -->
  <path d="M 9 9 Q 12 8 15 9" fill="none" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Braços -->
  <rect x="5" y="11" width="3" height="6" rx="1" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  <rect x="16" y="11" width="3" height="6" rx="1" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  
  <!-- Pernas -->
  <rect x="8" y="20" width="3" height="3" fill="#333333" stroke="#000000" stroke-width="0.5"/>
  <rect x="13" y="20" width="3" height="3" fill="#333333" stroke="#000000" stroke-width="0.5"/>
</svg>
