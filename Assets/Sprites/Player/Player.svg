<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Player - Funcionário com avental -->
  <defs>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3296FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E64C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corpo (camisa azul) -->
  <rect x="10" y="14" width="12" height="14" fill="url(#shirt)" stroke="#1E64C8" stroke-width="0.5"/>
  
  <!-- Avental branco -->
  <path d="M 11 15 L 11 26 L 21 26 L 21 15 L 19 13 L 13 13 Z" fill="url(#apron)" stroke="#CCCCCC" stroke-width="0.5"/>
  
  <!-- Cabeça (pele) -->
  <circle cx="16" cy="9" r="5" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  
  <!-- Cabelo -->
  <ellipse cx="16" cy="6" rx="5" ry="3" fill="#3D2817"/>
  
  <!-- Olhos -->
  <circle cx="14" cy="9" r="0.8" fill="#000000"/>
  <circle cx="18" cy="9" r="0.8" fill="#000000"/>
  
  <!-- Sorriso -->
  <path d="M 13 11 Q 16 12 19 11" fill="none" stroke="#000000" stroke-width="0.5" stroke-linecap="round"/>
  
  <!-- Braços -->
  <rect x="8" y="16" width="3" height="8" rx="1" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  <rect x="21" y="16" width="3" height="8" rx="1" fill="#FFD4A3" stroke="#E0A070" stroke-width="0.5"/>
  
  <!-- Pernas -->
  <rect x="11" y="26" width="4" height="5" fill="#1E64C8" stroke="#0D3264" stroke-width="0.5"/>
  <rect x="17" y="26" width="4" height="5" fill="#1E64C8" stroke="#0D3264" stroke-width="0.5"/>
  
  <!-- Pés -->
  <ellipse cx="13" cy="31" rx="2.5" ry="1" fill="#000000"/>
  <ellipse cx="19" cy="31" rx="2.5" ry="1" fill="#000000"/>
