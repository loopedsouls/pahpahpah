<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0515"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="spotlight" cx="70%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a2c6a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0a0515;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="720" fill="url(#spotlight)"/>
  
  <!-- Particles/dust -->
  <g fill="#ff00ff" opacity="0.3">
    <circle cx="200" cy="100" r="2"/>
    <circle cx="350" cy="200" r="1.5"/>
    <circle cx="150" cy="350" r="1"/>
    <circle cx="400" cy="450" r="2"/>
    <circle cx="250" cy="550" r="1.5"/>
    <circle cx="500" cy="150" r="1"/>
    <circle cx="600" cy="600" r="2"/>
  </g>
  
  <!-- GIANT CLOWN HEAD - Right side -->
  <g transform="translate(850, 360)">
    <!-- Head shadow/glow -->
    <ellipse cx="0" cy="0" rx="320" ry="380" fill="#ff00ff" opacity="0.1" filter="url(#bigGlow)"/>
    
    <!-- Main head shape -->
    <ellipse cx="0" cy="0" rx="280" ry="340" fill="#1a0a2e" stroke="#4080ff" stroke-width="4"/>
    
    <!-- Face base -->
    <ellipse cx="0" cy="20" rx="240" ry="280" fill="#ffddaa"/>
    
    <!-- Hair - wild clown hair -->
    <ellipse cx="-200" cy="-100" rx="100" ry="150" fill="#ff3333"/>
    <ellipse cx="200" cy="-100" rx="100" ry="150" fill="#ff3333"/>
    <ellipse cx="-150" cy="-200" rx="80" ry="100" fill="#ff3333"/>
    <ellipse cx="150" cy="-200" rx="80" ry="100" fill="#ff3333"/>
    <ellipse cx="0" cy="-250" rx="120" ry="80" fill="#ff3333"/>
    
    <!-- Face white paint -->
    <ellipse cx="0" cy="0" rx="200" ry="220" fill="#fff"/>
    
    <!-- Eyes - big expressive -->
    <g transform="translate(-70, -40)">
      <ellipse cx="0" cy="0" rx="50" ry="60" fill="#fff" stroke="#000" stroke-width="3"/>
      <ellipse cx="10" cy="5" rx="25" ry="30" fill="#4080ff"/>
      <ellipse cx="15" cy="0" rx="12" ry="15" fill="#000"/>
      <ellipse cx="18" cy="-5" rx="5" ry="6" fill="#fff"/>
    </g>
    <g transform="translate(70, -40)">
      <ellipse cx="0" cy="0" rx="50" ry="60" fill="#fff" stroke="#000" stroke-width="3"/>
      <ellipse cx="-10" cy="5" rx="25" ry="30" fill="#4080ff"/>
      <ellipse cx="-5" cy="0" rx="12" ry="15" fill="#000"/>
      <ellipse cx="-2" cy="-5" rx="5" ry="6" fill="#fff"/>
    </g>
    
    <!-- Eyebrows -->
    <path d="M-120,-100 Q-70,-130 -20,-100" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <path d="M120,-100 Q70,-130 20,-100" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Big red nose -->
    <ellipse cx="0" cy="40" rx="45" ry="40" fill="#ff0000" stroke="#cc0000" stroke-width="3"/>
    <ellipse cx="-10" cy="30" rx="15" ry="12" fill="#ff6666" opacity="0.6"/>
    
    <!-- Mouth - big smile -->
    <path d="M-100,120 Q0,220 100,120" fill="#000" stroke="#000" stroke-width="4"/>
    <path d="M-80,120 Q0,180 80,120" fill="#ff3366"/>
    
    <!-- Cheek dots -->
    <ellipse cx="-130" cy="60" rx="25" ry="20" fill="#ff6699" opacity="0.7"/>
    <ellipse cx="130" cy="60" rx="25" ry="20" fill="#ff6699" opacity="0.7"/>
    
    <!-- Neck ruffle hint -->
    <ellipse cx="0" cy="300" rx="150" ry="40" fill="#ffff00" stroke="#ffaa00" stroke-width="3"/>
    <ellipse cx="-50" cy="300" rx="30" ry="25" fill="#ffff00" stroke="#ffaa00" stroke-width="2"/>
    <ellipse cx="50" cy="300" rx="30" ry="25" fill="#ffff00" stroke="#ffaa00" stroke-width="2"/>
  </g>
  
  <!-- Decorative line left side -->
  <line x1="50" y1="150" x2="50" y2="570" stroke="#ff00ff" stroke-width="2" opacity="0.5"/>
  <line x1="55" y1="150" x2="55" y2="570" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
</svg>
