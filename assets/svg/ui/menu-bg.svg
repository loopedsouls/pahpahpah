<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0015"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    
    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0.3)"/>
    </pattern>
    
    <!-- Grid pattern -->
    <pattern id="grid" patternUnits="userSpaceOnUse" width="100" height="100">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
    </pattern>
    
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="300" fill="none" stroke="rgba(255,0,255,0.1)" stroke-width="2"/>
  <circle cx="1720" cy="880" r="400" fill="none" stroke="rgba(0,255,255,0.1)" stroke-width="2"/>
  <circle cx="960" cy="540" r="500" fill="none" stroke="rgba(255,215,0,0.05)" stroke-width="3"/>
  
  <!-- Floating particles/stars -->
  <g fill="url(#starGlow)" opacity="0.6">
    <circle cx="150" cy="100" r="2"/>
    <circle cx="300" cy="250" r="1.5"/>
    <circle cx="500" cy="150" r="2"/>
    <circle cx="700" cy="300" r="1"/>
    <circle cx="900" cy="100" r="2"/>
    <circle cx="1100" cy="200" r="1.5"/>
    <circle cx="1300" cy="150" r="2"/>
    <circle cx="1500" cy="300" r="1"/>
    <circle cx="1700" cy="100" r="2"/>
    <circle cx="1800" cy="250" r="1.5"/>
    <circle cx="200" cy="500" r="1"/>
    <circle cx="400" cy="700" r="2"/>
    <circle cx="600" cy="850" r="1.5"/>
    <circle cx="800" cy="950" r="2"/>
    <circle cx="1000" cy="800" r="1"/>
    <circle cx="1200" cy="900" r="2"/>
    <circle cx="1400" cy="750" r="1.5"/>
    <circle cx="1600" cy="850" r="2"/>
    <circle cx="1800" cy="700" r="1"/>
  </g>
  
  <!-- Neon decorative lines -->
  <g filter="url(#neonGlow)" opacity="0.4">
    <line x1="0" y1="200" x2="400" y2="200" stroke="#00d4ff" stroke-width="2"/>
    <line x1="1520" y1="200" x2="1920" y2="200" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="880" x2="400" y2="880" stroke="#ff00ff" stroke-width="2"/>
    <line x1="1520" y1="880" x2="1920" y2="880" stroke="#ff00ff" stroke-width="2"/>
  </g>
  
  <!-- Corner decorations -->
  <g stroke="#ffd700" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 50 20 L 20 20 L 20 50"/>
    <path d="M 1870 20 L 1900 20 L 1900 50"/>
    <path d="M 50 1060 L 20 1060 L 20 1030"/>
    <path d="M 1870 1060 L 1900 1060 L 1900 1030"/>
  </g>
  
  <!-- Arcade cabinet frame effect -->
  <rect x="10" y="10" width="1900" height="1060" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="4" rx="10"/>
  
  <!-- Scanlines overlay -->
  <rect width="1920" height="1080" fill="url(#scanlines)" opacity="0.3"/>
</svg>
