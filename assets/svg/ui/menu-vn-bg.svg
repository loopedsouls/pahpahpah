<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Gradient sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#4a2c6a"/>
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  
  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="100" cy="50" r="1"/>
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="350" cy="30" r="1"/>
    <circle cx="500" cy="100" r="1.2"/>
    <circle cx="650" cy="45" r="1"/>
    <circle cx="800" cy="70" r="1.5"/>
    <circle cx="950" cy="25" r="1"/>
    <circle cx="1100" cy="90" r="1.2"/>
    <circle cx="1200" cy="55" r="1"/>
    <circle cx="150" cy="120" r="0.8"/>
    <circle cx="450" cy="150" r="1"/>
    <circle cx="750" cy="130" r="0.8"/>
    <circle cx="1050" cy="140" r="1"/>
  </g>
  
  <!-- Arena floor gradient -->
  <ellipse cx="900" cy="700" rx="500" ry="150" fill="#2a1a4a" opacity="0.8"/>
  
  <!-- Spotlight effects -->
  <ellipse cx="550" cy="680" rx="80" ry="20" fill="#00ff00" opacity="0.15" filter="url(#softGlow)"/>
  <ellipse cx="700" cy="680" rx="80" ry="20" fill="#00ffff" opacity="0.15" filter="url(#softGlow)"/>
  <ellipse cx="850" cy="680" rx="80" ry="20" fill="#ff00ff" opacity="0.15" filter="url(#softGlow)"/>
  <ellipse cx="1000" cy="680" rx="80" ry="20" fill="#00ff88" opacity="0.15" filter="url(#softGlow)"/>
  <ellipse cx="1150" cy="680" rx="80" ry="20" fill="#ffaa00" opacity="0.15" filter="url(#softGlow)"/>
  
  <!-- CHARACTER 1: BITMASK (Digital cube) -->
  <g transform="translate(500, 280)">
    <!-- Body -->
    <rect x="-40" y="80" width="80" height="120" fill="#003300" stroke="#00ff00" stroke-width="2"/>
    <rect x="-35" y="85" width="70" height="110" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
    <!-- Head (cube) -->
    <rect x="-50" y="-50" width="100" height="100" fill="#001a00" stroke="#00ff00" stroke-width="3"/>
    <!-- Digital face -->
    <rect x="-30" y="-20" width="15" height="20" fill="#00ff00"/>
    <rect x="15" y="-20" width="15" height="20" fill="#00ff00"/>
    <rect x="-20" y="20" width="40" height="8" fill="#00ff00"/>
    <!-- Binary code decoration -->
    <text x="-40" y="-35" font-family="monospace" font-size="8" fill="#00ff00" opacity="0.7">10110</text>
    <text x="10" y="-35" font-family="monospace" font-size="8" fill="#00ff00" opacity="0.7">01101</text>
    <!-- Glow -->
    <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#00ff00" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
  </g>
  
  <!-- CHARACTER 2: ALPHAMASK (Ghost) -->
  <g transform="translate(700, 300)">
    <!-- Ethereal body -->
    <path d="M-30,60 Q-50,120 -40,180 Q-20,200 0,180 Q20,200 40,180 Q50,120 30,60 Z" fill="#004444" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="45" ry="55" fill="#003333" stroke="#00ffff" stroke-width="3"/>
    <!-- Ghost eyes -->
    <ellipse cx="-15" cy="-10" rx="12" ry="18" fill="#00ffff" opacity="0.9"/>
    <ellipse cx="15" cy="-10" rx="12" ry="18" fill="#00ffff" opacity="0.9"/>
    <ellipse cx="-15" cy="-5" rx="6" ry="10" fill="#001a1a"/>
    <ellipse cx="15" cy="-5" rx="6" ry="10" fill="#001a1a"/>
    <!-- Ethereal wisps -->
    <path d="M-40,40 Q-60,80 -30,100" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.5"/>
    <path d="M40,40 Q60,80 30,100" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.5"/>
    <!-- Glow -->
    <ellipse cx="0" cy="0" rx="45" ry="55" fill="none" stroke="#00ffff" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
  </g>
  
  <!-- CHARACTER 3: DATAMASK (Chaos entity) -->
  <g transform="translate(850, 290)">
    <!-- Chaotic body -->
    <path d="M-35,70 L-45,180 L0,160 L45,180 L35,70 Z" fill="#330033" stroke="#ff00ff" stroke-width="2"/>
    <!-- Head (glitchy) -->
    <polygon points="0,-60 50,0 40,50 -40,50 -50,0" fill="#220022" stroke="#ff00ff" stroke-width="3"/>
    <!-- Glitch eyes -->
    <rect x="-25" y="-20" width="20" height="5" fill="#ff00ff"/>
    <rect x="-20" y="-15" width="15" height="5" fill="#ff00ff"/>
    <rect x="5" y="-20" width="20" height="5" fill="#ff00ff"/>
    <rect x="10" y="-15" width="15" height="5" fill="#ff00ff"/>
    <!-- Glitch mouth -->
    <rect x="-15" y="15" width="30" height="3" fill="#ff00ff"/>
    <rect x="-10" y="20" width="20" height="3" fill="#ff00ff"/>
    <!-- Glitch effects -->
    <rect x="-55" y="-30" width="110" height="3" fill="#ff00ff" opacity="0.3"/>
    <rect x="-55" y="10" width="110" height="2" fill="#ff00ff" opacity="0.2"/>
    <!-- Glow -->
    <polygon points="0,-60 50,0 40,50 -40,50 -50,0" fill="none" stroke="#ff00ff" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
  </g>
  
  <!-- CHARACTER 4: SURGICAL (Healer) -->
  <g transform="translate(1000, 290)">
    <!-- Medical coat body -->
    <path d="M-40,70 L-50,190 L50,190 L40,70 Z" fill="#003322" stroke="#00ff88" stroke-width="2"/>
    <line x1="0" y1="70" x2="0" y2="190" stroke="#00ff88" stroke-width="1"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#002211" stroke="#00ff88" stroke-width="3"/>
    <!-- Mask -->
    <path d="M-30,10 Q0,40 30,10 L25,35 Q0,50 -25,35 Z" fill="#00ff88" opacity="0.3" stroke="#00ff88" stroke-width="2"/>
    <!-- Eyes -->
    <ellipse cx="-12" cy="-10" rx="8" ry="10" fill="#00ff88" opacity="0.8"/>
    <ellipse cx="12" cy="-10" rx="8" ry="10" fill="#00ff88" opacity="0.8"/>
    <!-- Cross symbol -->
    <rect x="-8" y="60" width="16" height="40" fill="#00ff88" opacity="0.5"/>
    <rect x="-20" y="72" width="40" height="16" fill="#00ff88" opacity="0.5"/>
    <!-- Glow -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="none" stroke="#00ff88" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
  </g>
  
  <!-- CHARACTER 5: SHADER (Time master) -->
  <g transform="translate(1150, 280)">
    <!-- Robed body -->
    <path d="M-45,80 Q-60,150 -50,200 L50,200 Q60,150 45,80 Z" fill="#332200" stroke="#ffaa00" stroke-width="2"/>
    <!-- Head with hood -->
    <path d="M-50,-40 Q-60,20 -40,60 L40,60 Q60,20 50,-40 Q0,-60 -50,-40 Z" fill="#221100" stroke="#ffaa00" stroke-width="3"/>
    <!-- Clock face -->
    <circle cx="0" cy="10" r="30" fill="#111" stroke="#ffaa00" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="-10" stroke="#ffaa00" stroke-width="2"/>
    <line x1="0" y1="10" x2="15" y2="15" stroke="#ffaa00" stroke-width="2"/>
    <!-- Hour marks -->
    <circle cx="0" cy="-15" r="2" fill="#ffaa00"/>
    <circle cx="20" cy="10" r="2" fill="#ffaa00"/>
    <circle cx="0" cy="35" r="2" fill="#ffaa00"/>
    <circle cx="-20" cy="10" r="2" fill="#ffaa00"/>
    <!-- Time particles -->
    <circle cx="-30" cy="-20" r="3" fill="#ffaa00" opacity="0.6"/>
    <circle cx="35" cy="0" r="2" fill="#ffaa00" opacity="0.4"/>
    <circle cx="-25" cy="40" r="2" fill="#ffaa00" opacity="0.5"/>
    <!-- Glow -->
    <circle cx="0" cy="10" r="30" fill="none" stroke="#ffaa00" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
  </g>
  
  <!-- Decorative frame for left side menu area -->
  <rect x="20" y="150" width="350" height="450" fill="#0a0515" opacity="0.85" rx="10"/>
  <rect x="20" y="150" width="350" height="450" fill="none" stroke="#6633aa" stroke-width="2" rx="10" opacity="0.6"/>
  
  <!-- Title area glow -->
  <rect x="30" y="160" width="330" height="80" fill="#1a0a2e" rx="5"/>
  <rect x="30" y="160" width="330" height="80" fill="none" stroke="#ff00ff" stroke-width="1" rx="5" opacity="0.5"/>
</svg>
