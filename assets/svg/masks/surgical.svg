<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- MÁSCARA CIRÚRGICA - Simples e hospitalar -->
  
  <!-- Base da máscara -->
  <rect x="4" y="10" width="24" height="14" rx="2" fill="#e0f0ff" stroke="#4080c0" stroke-width="1.5"/>
  
  <!-- Pregas da máscara -->
  <line x1="4" y1="14" x2="28" y2="14" stroke="#a0c0e0" stroke-width="1"/>
  <line x1="4" y1="17" x2="28" y2="17" stroke="#a0c0e0" stroke-width="1"/>
  <line x1="4" y1="20" x2="28" y2="20" stroke="#a0c0e0" stroke-width="1"/>
  
  <!-- Elásticos -->
  <path d="M 4 12 Q 2 12 2 16 Q 2 20 4 20" stroke="#4080c0" fill="none" stroke-width="1.5"/>
  <path d="M 28 12 Q 30 12 30 16 Q 30 20 28 20" stroke="#4080c0" fill="none" stroke-width="1.5"/>
  
  <!-- Clipe nasal -->
  <rect x="14" y="9" width="4" height="2" rx="0.5" fill="#8090a0"/>
  
  <!-- Cruz de saúde -->
  <rect x="15" y="15" width="2" height="6" fill="#ff4060"/>
  <rect x="13" y="17" width="6" height="2" fill="#ff4060"/>
</svg>
