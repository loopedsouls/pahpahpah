<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ALPHA MASK - Máscara translúcida com gradiente -->
  <defs>
    <linearGradient id="alphaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4000ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Base da máscara -->
  <ellipse cx="16" cy="16" rx="12" ry="14" fill="url(#alphaGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Efeito fantasma -->
  <ellipse cx="16" cy="16" rx="10" ry="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <ellipse cx="16" cy="16" rx="8" ry="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Olhos -->
  <ellipse cx="11" cy="14" rx="2.5" ry="3" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="21" cy="14" rx="2.5" ry="3" fill="#ffffff" opacity="0.8"/>
  
  <!-- Ondas de transparência -->
  <path d="M 8 22 Q 16 20 24 22" stroke="#00d4ff" fill="none" stroke-width="1.5" opacity="0.7"/>
  <path d="M 10 25 Q 16 23 22 25" stroke="#00d4ff" fill="none" stroke-width="1" opacity="0.5"/>
</svg>
