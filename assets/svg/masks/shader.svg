<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- SHADER MASK - Psicodélica com cores vibrantes -->
  <defs>
    <radialGradient id="psychedelic">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base da máscara -->
  <ellipse cx="16" cy="16" rx="12" ry="14" fill="url(#psychedelic)" filter="url(#glow)"/>
  
  <!-- Ondas psicodélicas -->
  <ellipse cx="16" cy="16" rx="10" ry="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="8" ry="10" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="6" ry="8" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  
  <!-- Olhos estilizados -->
  <circle cx="11" cy="14" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="11" cy="14" r="1.5" fill="#000000"/>
  <circle cx="21" cy="14" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="21" cy="14" r="1.5" fill="#000000"/>
  
  <!-- Padrão de ondas -->
  <path d="M 8 22 Q 12 20 16 22 T 24 22" stroke="#ffff00" fill="none" stroke-width="2" opacity="0.7"/>
</svg>
