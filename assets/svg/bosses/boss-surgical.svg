<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="sgBossGlow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="sgBossBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66ffaa"/>
      <stop offset="100%" style="stop-color:#006633"/>
    </linearGradient>
    <radialGradient id="sgBossHeart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6666"/>
      <stop offset="100%" style="stop-color:#990000"/>
    </radialGradient>
  </defs>
  <!-- Corpo do curandeiro -->
  <g filter="url(#sgBossGlow)">
    <!-- Corpo principal oval -->
    <ellipse cx="64" cy="65" rx="35" ry="45" fill="url(#sgBossBody)"/>
    <!-- Cabeça -->
    <circle cx="64" cy="35" r="25" fill="url(#sgBossBody)"/>
    <!-- Cruz na testa -->
    <g fill="#ffffff" opacity="0.9">
      <rect x="61" y="22" width="6" height="20"/>
      <rect x="54" y="29" width="20" height="6"/>
    </g>
    <!-- Olhos bondosos -->
    <ellipse cx="54" cy="38" rx="6" ry="8" fill="#003311"/>
    <ellipse cx="74" cy="38" rx="6" ry="8" fill="#003311"/>
    <circle cx="54" cy="36" r="3" fill="#00ff88"/>
    <circle cx="74" cy="36" r="3" fill="#00ff88"/>
    <!-- Sorriso -->
    <path d="M 52,50 Q 64,60 76,50" stroke="#003311" stroke-width="3" fill="none"/>
    <!-- Coração no peito -->
    <path d="M 64,60 C 54,50 44,60 44,70 C 44,82 64,95 64,95 C 64,95 84,82 84,70 C 84,60 74,50 64,60" 
          fill="url(#sgBossHeart)" opacity="0.8"/>
    <!-- Cruz no coração -->
    <g fill="#ffffff" opacity="0.7">
      <rect x="62" y="65" width="4" height="16"/>
      <rect x="56" y="71" width="16" height="4"/>
    </g>
    <!-- Braços curandeiros -->
    <ellipse cx="25" cy="70" rx="12" ry="20" fill="url(#sgBossBody)"/>
    <ellipse cx="103" cy="70" rx="12" ry="20" fill="url(#sgBossBody)"/>
    <!-- Mãos com aura de cura -->
    <circle cx="20" cy="90" r="10" fill="#00ff88" opacity="0.5"/>
    <circle cx="108" cy="90" r="10" fill="#00ff88" opacity="0.5"/>
    <circle cx="20" cy="90" r="6" fill="url(#sgBossBody)"/>
    <circle cx="108" cy="90" r="6" fill="url(#sgBossBody)"/>
  </g>
  <!-- Aura de cura -->
  <g stroke="#00ff88" fill="none" opacity="0.3" stroke-width="2">
    <circle cx="64" cy="65" r="50"/>
    <circle cx="64" cy="65" r="58"/>
  </g>
</svg>
