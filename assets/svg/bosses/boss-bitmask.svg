<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="bmBossGlow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bmBossBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00"/>
      <stop offset="100%" style="stop-color:#004400"/>
    </linearGradient>
  </defs>
  <!-- Corpo principal - cubo digital -->
  <g filter="url(#bmBossGlow)">
    <!-- Base do corpo -->
    <rect x="34" y="40" width="60" height="60" fill="url(#bmBossBody)" rx="5"/>
    <!-- Padrão de circuito -->
    <g stroke="#00ff00" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 44,50 L 44,70 L 64,70"/>
      <path d="M 84,50 L 84,70 L 64,70"/>
      <path d="M 64,70 L 64,90"/>
      <circle cx="44" cy="50" r="3" fill="#00ff00"/>
      <circle cx="84" cy="50" r="3" fill="#00ff00"/>
      <circle cx="64" cy="90" r="3" fill="#00ff00"/>
    </g>
    <!-- Olhos LED -->
    <rect x="44" y="55" width="12" height="8" fill="#00ff00" rx="2"/>
    <rect x="72" y="55" width="12" height="8" fill="#00ff00" rx="2"/>
    <!-- Boca digital -->
    <rect x="50" y="75" width="28" height="4" fill="#003300"/>
    <g fill="#00ff00">
      <rect x="52" y="76" width="4" height="2"/>
      <rect x="58" y="76" width="4" height="2"/>
      <rect x="64" y="76" width="4" height="2"/>
      <rect x="70" y="76" width="4" height="2"/>
    </g>
    <!-- Antenas/sensores -->
    <line x1="44" y1="40" x2="44" y2="25" stroke="#00ff00" stroke-width="3"/>
    <line x1="84" y1="40" x2="84" y2="25" stroke="#00ff00" stroke-width="3"/>
    <circle cx="44" cy="22" r="5" fill="#00ff00"/>
    <circle cx="84" cy="22" r="5" fill="#00ff00"/>
    <!-- Braços mecânicos -->
    <rect x="20" y="55" width="14" height="30" fill="url(#bmBossBody)" rx="3"/>
    <rect x="94" y="55" width="14" height="30" fill="url(#bmBossBody)" rx="3"/>
    <circle cx="27" cy="90" r="8" fill="#00ff00" opacity="0.7"/>
    <circle cx="101" cy="90" r="8" fill="#00ff00" opacity="0.7"/>
  </g>
  <!-- Aura de bits -->
  <g fill="#00ff00" opacity="0.4" font-family="monospace" font-size="8">
    <text x="15" y="35">01</text>
    <text x="100" y="35">10</text>
    <text x="10" y="115">11</text>
    <text x="105" y="115">00</text>
  </g>
</svg>
