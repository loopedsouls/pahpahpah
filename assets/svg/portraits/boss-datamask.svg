<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="chaosGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="50%" style="stop-color:#8800aa"/>
      <stop offset="100%" style="stop-color:#440066"/>
    </radialGradient>
    <filter id="chaosGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#1a0a1a" stroke="#ff00ff" stroke-width="4"/>
  
  <!-- Chaos particles -->
  <circle cx="30" cy="40" r="8" fill="#ff00ff" opacity="0.5"/>
  <circle cx="170" cy="50" r="6" fill="#ff66ff" opacity="0.4"/>
  <circle cx="25" cy="160" r="7" fill="#cc00cc" opacity="0.5"/>
  <circle cx="175" cy="145" r="5" fill="#ff00ff" opacity="0.3"/>
  
  <!-- Main chaotic form -->
  <g filter="url(#chaosGlow)">
    <!-- Irregular body shape -->
    <path d="M 60 50 
             Q 40 70 50 90 
             Q 30 110 50 130 
             Q 40 150 60 160 
             L 80 170 
             Q 100 180 120 170 
             L 140 160 
             Q 160 150 150 130 
             Q 170 110 150 90 
             Q 160 70 140 50 
             Q 120 30 100 35 
             Q 80 30 60 50 Z" 
          fill="url(#chaosGrad)" 
          stroke="#ff00ff" 
          stroke-width="2"/>
  </g>
  
  <!-- Multiple chaotic eyes -->
  <circle cx="70" cy="70" r="12" fill="#220022" stroke="#ff00ff"/>
  <circle cx="130" cy="75" r="14" fill="#220022" stroke="#ff00ff"/>
  <circle cx="85" cy="100" r="8" fill="#220022" stroke="#ff00ff"/>
  
  <!-- Glowing pupils -->
  <circle cx="70" cy="70" r="5" fill="#ff00ff"/>
  <circle cx="130" cy="75" r="6" fill="#ff00ff"/>
  <circle cx="85" cy="100" r="3" fill="#ff00ff"/>
  
  <!-- Jagged mouth -->
  <path d="M 70 130 L 85 120 L 100 135 L 115 120 L 130 130 L 115 140 L 100 125 L 85 140 Z" 
        fill="#220022" stroke="#ff00ff" stroke-width="2"/>
  
  <!-- Floating data fragments -->
  <text x="45" y="45" font-family="monospace" font-size="8" fill="#ff00ff" opacity="0.6">???</text>
  <text x="145" y="165" font-family="monospace" font-size="8" fill="#ff00ff" opacity="0.6">!!!</text>
</svg>
