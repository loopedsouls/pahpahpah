<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffe4c4"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#4080ff" stroke-width="4"/>
  
  <!-- Clown body hint -->
  <ellipse cx="100" cy="180" rx="60" ry="30" fill="#4080ff"/>
  
  <!-- Face -->
  <circle cx="100" cy="90" r="55" fill="url(#faceGrad)"/>
  
  <!-- Red nose -->
  <circle cx="100" cy="95" r="15" fill="#ff2020" filter="url(#glow)"/>
  
  <!-- Eyes -->
  <ellipse cx="75" cy="75" rx="12" ry="15" fill="white"/>
  <ellipse cx="125" cy="75" rx="12" ry="15" fill="white"/>
  <circle cx="75" cy="77" r="6" fill="#222"/>
  <circle cx="125" cy="77" r="6" fill="#222"/>
  <circle cx="77" cy="75" r="2" fill="white"/>
  <circle cx="127" cy="75" r="2" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M 60 60 Q 75 50 90 60" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M 110 60 Q 125 50 140 60" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M 65 110 Q 100 145 135 110" fill="none" stroke="#ff2020" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Hair/Hat -->
  <path d="M 45 60 Q 30 30 60 25 Q 100 10 140 25 Q 170 30 155 60" fill="#4080ff" stroke="#2060c0" stroke-width="2"/>
  
  <!-- Collar ruffles -->
  <ellipse cx="70" cy="155" rx="20" ry="10" fill="#ffd700"/>
  <ellipse cx="100" cy="160" rx="20" ry="10" fill="#ffd700"/>
  <ellipse cx="130" cy="155" rx="20" ry="10" fill="#ffd700"/>
</svg>
