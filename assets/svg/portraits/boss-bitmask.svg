<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bitmaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00"/>
      <stop offset="100%" style="stop-color:#005500"/>
    </linearGradient>
    <filter id="digitalGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#0a1a0a" stroke="#00ff00" stroke-width="4"/>
  
  <!-- Binary pattern background -->
  <text x="20" y="40" font-family="monospace" font-size="10" fill="rgba(0,255,0,0.2)">01101001</text>
  <text x="120" y="60" font-family="monospace" font-size="10" fill="rgba(0,255,0,0.2)">10110010</text>
  <text x="40" y="170" font-family="monospace" font-size="10" fill="rgba(0,255,0,0.2)">11001101</text>
  
  <!-- Digital cube head -->
  <g filter="url(#digitalGlow)">
    <rect x="50" y="40" width="100" height="100" fill="url(#bitmaskGrad)" stroke="#00ff00" stroke-width="3"/>
    
    <!-- 3D effect lines -->
    <line x1="150" y1="40" x2="170" y2="20" stroke="#00ff00" stroke-width="2"/>
    <line x1="150" y1="140" x2="170" y2="120" stroke="#00ff00" stroke-width="2"/>
    <line x1="50" y1="40" x2="70" y2="20" stroke="#00ff00" stroke-width="2"/>
    <line x1="70" y1="20" x2="170" y2="20" stroke="#00ff00" stroke-width="2"/>
    <line x1="170" y1="20" x2="170" y2="120" stroke="#00ff00" stroke-width="2"/>
  </g>
  
  <!-- Digital eyes -->
  <rect x="65" y="65" width="25" height="25" fill="#001100" stroke="#00ff00" stroke-width="2"/>
  <rect x="110" y="65" width="25" height="25" fill="#001100" stroke="#00ff00" stroke-width="2"/>
  
  <!-- Scanning line in eyes -->
  <line x1="68" y1="77" x2="87" y2="77" stroke="#00ff00" stroke-width="3"/>
  <line x1="113" y1="77" x2="132" y2="77" stroke="#00ff00" stroke-width="3"/>
  
  <!-- Digital mouth -->
  <rect x="70" y="105" width="60" height="20" fill="#001100" stroke="#00ff00" stroke-width="2"/>
  <text x="77" y="120" font-family="monospace" font-size="14" fill="#00ff00">1010</text>
  
  <!-- Body hint -->
  <rect x="60" y="150" width="80" height="40" fill="url(#bitmaskGrad)" stroke="#00ff00" stroke-width="2"/>
</svg>
