<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ghostGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,255,255,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(0,100,100,0.3)"/>
    </radialGradient>
    <filter id="ghostGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#0a1a1a" stroke="#00ffff" stroke-width="4"/>
  
  <!-- Ethereal particles -->
  <circle cx="40" cy="50" r="5" fill="rgba(0,255,255,0.3)"/>
  <circle cx="160" cy="70" r="4" fill="rgba(0,255,255,0.4)"/>
  <circle cx="30" cy="150" r="3" fill="rgba(0,255,255,0.3)"/>
  <circle cx="170" cy="130" r="5" fill="rgba(0,255,255,0.2)"/>
  
  <!-- Ghost body -->
  <g filter="url(#ghostGlow)">
    <path d="M 50 80 
             Q 50 30 100 30 
             Q 150 30 150 80 
             L 150 150 
             Q 140 140 130 150 
             Q 120 160 110 150 
             Q 100 140 90 150 
             Q 80 160 70 150 
             Q 60 140 50 150 
             Z" 
          fill="url(#ghostGrad)" 
          stroke="#00ffff" 
          stroke-width="2"/>
  </g>
  
  <!-- Hollow eyes -->
  <ellipse cx="75" cy="80" rx="15" ry="20" fill="#001515"/>
  <ellipse cx="125" cy="80" rx="15" ry="20" fill="#001515"/>
  
  <!-- Glowing eye centers -->
  <circle cx="75" cy="85" r="5" fill="#00ffff" filter="url(#ghostGlow)"/>
  <circle cx="125" cy="85" r="5" fill="#00ffff" filter="url(#ghostGlow)"/>
  
  <!-- Ghostly mouth -->
  <ellipse cx="100" cy="115" rx="20" ry="10" fill="#001515"/>
  
  <!-- Transparency effect stripes -->
  <line x1="60" y1="130" x2="60" y2="145" stroke="rgba(0,255,255,0.3)" stroke-width="2"/>
  <line x1="80" y1="135" x2="80" y2="148" stroke="rgba(0,255,255,0.3)" stroke-width="2"/>
  <line x1="100" y1="130" x2="100" y2="145" stroke="rgba(0,255,255,0.3)" stroke-width="2"/>
  <line x1="120" y1="135" x2="120" y2="148" stroke="rgba(0,255,255,0.3)" stroke-width="2"/>
  <line x1="140" y1="130" x2="140" y2="145" stroke="rgba(0,255,255,0.3)" stroke-width="2"/>
</svg>
