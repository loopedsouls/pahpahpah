<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdd00"/>
      <stop offset="50%" style="stop-color:#ffaa00"/>
      <stop offset="100%" style="stop-color:#aa6600"/>
    </linearGradient>
    <filter id="timeGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#1a1505" stroke="#ffaa00" stroke-width="4"/>
  
  <!-- Time particles/dust -->
  <circle cx="35" cy="45" r="3" fill="#ffdd00" opacity="0.5"/>
  <circle cx="165" cy="55" r="4" fill="#ffaa00" opacity="0.4"/>
  <circle cx="40" cy="155" r="3" fill="#ffdd00" opacity="0.4"/>
  <circle cx="160" cy="150" r="5" fill="#ffaa00" opacity="0.3"/>
  
  <!-- Main clock body -->
  <g filter="url(#timeGlow)">
    <circle cx="100" cy="90" r="55" fill="url(#timeGrad)" stroke="#ffaa00" stroke-width="3"/>
  </g>
  
  <!-- Clock face -->
  <circle cx="100" cy="90" r="45" fill="#1a1000" stroke="#ffdd00" stroke-width="2"/>
  
  <!-- Clock markings -->
  <g stroke="#ffaa00" stroke-width="2">
    <line x1="100" y1="50" x2="100" y2="55"/>
    <line x1="100" y1="125" x2="100" y2="130"/>
    <line x1="60" y1="90" x2="65" y2="90"/>
    <line x1="135" y1="90" x2="140" y2="90"/>
  </g>
  
  <!-- Clock hands -->
  <line x1="100" y1="90" x2="100" y2="60" stroke="#ffdd00" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="90" x2="125" y2="100" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Center eye -->
  <circle cx="100" cy="90" r="10" fill="#ffdd00"/>
  <circle cx="100" cy="90" r="5" fill="#1a1000"/>
  
  <!-- Hourglass body below -->
  <path d="M 70 150 L 85 160 L 85 180 L 70 190 L 130 190 L 115 180 L 115 160 L 130 150 Z" 
        fill="url(#timeGrad)" stroke="#ffaa00" stroke-width="2"/>
  
  <!-- Sand in hourglass -->
  <path d="M 85 165 L 100 175 L 115 165" fill="none" stroke="#ffdd00" stroke-width="2"/>
  <ellipse cx="100" cy="183" rx="12" ry="4" fill="#ffdd00"/>
  
  <!-- Time spiral decorations -->
  <path d="M 45 80 Q 35 90 45 100" fill="none" stroke="rgba(255,170,0,0.5)" stroke-width="2"/>
  <path d="M 155 80 Q 165 90 155 100" fill="none" stroke="rgba(255,170,0,0.5)" stroke-width="2"/>
</svg>
