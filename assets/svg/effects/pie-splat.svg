<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Explosão de torta -->
  <defs>
    <radialGradient id="splat">
      <stop offset="0%" style="stop-color:#fffacd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe4b5;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Respingos principais -->
  <circle cx="16" cy="16" r="8" fill="url(#splat)"/>
  
  <!-- Gotas espalhadas -->
  <circle cx="8" cy="10" r="3" fill="#fffacd" opacity="0.8"/>
  <circle cx="24" cy="12" r="2.5" fill="#fffacd" opacity="0.8"/>
  <circle cx="10" cy="24" r="2" fill="#ffe4b5" opacity="0.7"/>
  <circle cx="22" cy="22" r="2.5" fill="#ffe4b5" opacity="0.7"/>
  <circle cx="16" cy="6" r="2" fill="#fff8dc" opacity="0.6"/>
  <circle cx="6" cy="18" r="1.5" fill="#fff8dc" opacity="0.6"/>
  <circle cx="26" cy="20" r="1.5" fill="#fff8dc" opacity="0.6"/>
  
  <!-- Partículas pequenas -->
  <circle cx="12" cy="8" r="1" fill="#ffffff"/>
  <circle cx="20" cy="10" r="1" fill="#ffffff"/>
  <circle cx="14" cy="26" r="1" fill="#ffffff"/>
  <circle cx="24" cy="16" r="1" fill="#ffffff"/>
