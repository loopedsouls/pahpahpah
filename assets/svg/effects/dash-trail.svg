<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Efeito de dash -->
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Rastro de movimento -->
  <ellipse cx="16" cy="16" rx="14" ry="8" fill="url(#dashGrad)"/>
  <ellipse cx="12" cy="16" rx="10" ry="6" fill="url(#dashGrad)" opacity="0.7"/>
  <ellipse cx="8" cy="16" rx="6" ry="4" fill="url(#dashGrad)" opacity="0.4"/>
  
  <!-- Linhas de velocidade -->
  <line x1="2" y1="12" x2="10" y2="12" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <line x1="4" y1="16" x2="14" y2="16" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <line x1="2" y1="20" x2="10" y2="20" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
</svg>
