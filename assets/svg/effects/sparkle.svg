<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Sparkle de coleta -->
  <defs>
    <radialGradient id="sparkleGrad">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Centro brilhante -->
  <circle cx="12" cy="12" r="4" fill="url(#sparkleGrad)"/>
  
  <!-- Estrela de 4 pontas -->
  <polygon points="12,2 13,11 12,11 11,11" fill="#ffffff" opacity="0.9"/>
  <polygon points="12,22 13,13 12,13 11,13" fill="#ffffff" opacity="0.9"/>
  <polygon points="2,12 11,13 11,12 11,11" fill="#ffffff" opacity="0.9"/>
  <polygon points="22,12 13,13 13,12 13,11" fill="#ffffff" opacity="0.9"/>
  
  <!-- Pontos menores diagonais -->
  <circle cx="6" cy="6" r="1.5" fill="#ffd700"/>
  <circle cx="18" cy="6" r="1.5" fill="#ffd700"/>
  <circle cx="6" cy="18" r="1.5" fill="#ffd700"/>
  <circle cx="18" cy="18" r="1.5" fill="#ffd700"/>
</svg>
