<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradiente do piso principal -->
    <radialGradient id="floorGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#2a1a3d"/>
      <stop offset="60%" style="stop-color:#1a0f28"/>
      <stop offset="100%" style="stop-color:#0d0815"/>
    </radialGradient>
    
    <!-- Gradiente para as linhas de grade -->
    <linearGradient id="gridLineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2a6a;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#6a3a8a;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#4a2a6a;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- Brilho central da arena -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#ff4500;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Padrão hexagonal -->
    <pattern id="hexPattern" x="0" y="0" width="120" height="104" patternUnits="userSpaceOnUse">
      <polygon points="60,0 120,26 120,78 60,104 0,78 0,26" fill="none" stroke="#3a2a5a" stroke-width="1" opacity="0.4"/>
      <polygon points="60,10 110,32 110,72 60,94 10,72 10,32" fill="none" stroke="#4a3a6a" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    
    <!-- Filtro de brilho -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sombra interna -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="30"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#000000" result="color"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo base -->
  <rect width="1920" height="1080" fill="url(#floorGradient)"/>
  
  <!-- Padrão hexagonal de fundo -->
  <rect width="1920" height="1080" fill="url(#hexPattern)"/>
  
  <!-- Grade perspectiva - linhas horizontais -->
  <g opacity="0.3">
    <line x1="0" y1="180" x2="1920" y2="180" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="0" y1="300" x2="1920" y2="300" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="0" y1="420" x2="1920" y2="420" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="url(#gridLineGradient)" stroke-width="2"/>
    <line x1="0" y1="660" x2="1920" y2="660" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="0" y1="780" x2="1920" y2="780" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="0" y1="900" x2="1920" y2="900" stroke="url(#gridLineGradient)" stroke-width="1"/>
  </g>
  
  <!-- Grade perspectiva - linhas verticais -->
  <g opacity="0.3">
    <line x1="320" y1="0" x2="320" y2="1080" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="1080" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="1080" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="url(#gridLineGradient)" stroke-width="2"/>
    <line x1="1120" y1="0" x2="1120" y2="1080" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="1360" y1="0" x2="1360" y2="1080" stroke="url(#gridLineGradient)" stroke-width="1"/>
    <line x1="1600" y1="0" x2="1600" y2="1080" stroke="url(#gridLineGradient)" stroke-width="1"/>
  </g>
  
  <!-- Círculo central da arena -->
  <circle cx="960" cy="540" r="280" fill="none" stroke="#ff6b35" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
  <circle cx="960" cy="540" r="200" fill="none" stroke="#ff4500" stroke-width="2" opacity="0.3"/>
  <circle cx="960" cy="540" r="120" fill="none" stroke="#ffa500" stroke-width="2" opacity="0.25"/>
  <circle cx="960" cy="540" r="40" fill="#ff6b35" opacity="0.1"/>
  
  <!-- Brilho central -->
  <ellipse cx="960" cy="540" rx="500" ry="400" fill="url(#centerGlow)"/>
  
  <!-- Marcações de canto - estilo arena de luta -->
  <!-- Canto superior esquerdo -->
  <g opacity="0.5">
    <path d="M 80,80 L 200,80 L 200,90 L 90,90 L 90,200 L 80,200 Z" fill="#ff6b35"/>
    <path d="M 100,100 L 180,100 L 180,108 L 108,108 L 108,180 L 100,180 Z" fill="#4a2a6a"/>
  </g>
  
  <!-- Canto superior direito -->
  <g opacity="0.5">
    <path d="M 1840,80 L 1720,80 L 1720,90 L 1830,90 L 1830,200 L 1840,200 Z" fill="#ff6b35"/>
    <path d="M 1820,100 L 1740,100 L 1740,108 L 1812,108 L 1812,180 L 1820,180 Z" fill="#4a2a6a"/>
  </g>
  
  <!-- Canto inferior esquerdo -->
  <g opacity="0.5">
    <path d="M 80,1000 L 200,1000 L 200,990 L 90,990 L 90,880 L 80,880 Z" fill="#ff6b35"/>
    <path d="M 100,980 L 180,980 L 180,972 L 108,972 L 108,900 L 100,900 Z" fill="#4a2a6a"/>
  </g>
  
  <!-- Canto inferior direito -->
  <g opacity="0.5">
    <path d="M 1840,1000 L 1720,1000 L 1720,990 L 1830,990 L 1830,880 L 1840,880 Z" fill="#ff6b35"/>
    <path d="M 1820,980 L 1740,980 L 1740,972 L 1812,972 L 1812,900 L 1820,900 Z" fill="#4a2a6a"/>
  </g>
  
  <!-- Detalhes decorativos - linhas de energia -->
  <g opacity="0.2" filter="url(#glow)">
    <line x1="0" y1="540" x2="460" y2="540" stroke="#00d4ff" stroke-width="3"/>
    <line x1="1460" y1="540" x2="1920" y2="540" stroke="#00d4ff" stroke-width="3"/>
    <line x1="960" y1="0" x2="960" y2="140" stroke="#00d4ff" stroke-width="3"/>
    <line x1="960" y1="940" x2="960" y2="1080" stroke="#00d4ff" stroke-width="3"/>
  </g>
  
  <!-- Pontos de luz nos cantos -->
  <circle cx="80" cy="80" r="6" fill="#ff6b35" filter="url(#glow)" opacity="0.8"/>
  <circle cx="1840" cy="80" r="6" fill="#ff6b35" filter="url(#glow)" opacity="0.8"/>
  <circle cx="80" cy="1000" r="6" fill="#ff6b35" filter="url(#glow)" opacity="0.8"/>
  <circle cx="1840" cy="1000" r="6" fill="#ff6b35" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Borda luminosa sutil -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#4a2a6a" stroke-width="2" opacity="0.4" rx="10"/>
  <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#3a1a5a" stroke-width="1" opacity="0.3" rx="5"/>
  
  <!-- Vinheta/escurecimento das bordas -->
  <rect width="1920" height="1080" fill="url(#floorGradient)" opacity="0.3" filter="url(#innerShadow)"/>
</svg>
