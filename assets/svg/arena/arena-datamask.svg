<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="dmFloor" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#2a1a2a"/>
      <stop offset="60%" style="stop-color:#1a0f1a"/>
      <stop offset="100%" style="stop-color:#100810"/>
    </radialGradient>
    <radialGradient id="dmGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="dmGlitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="dmNeon"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dmMatrix" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <text x="0" y="15" font-family="monospace" font-size="12" fill="#ff00ff" opacity="0.2">?</text>
      <text x="30" y="45" font-family="monospace" font-size="12" fill="#ff00ff" opacity="0.15">¿</text>
      <text x="15" y="30" font-family="monospace" font-size="12" fill="#ff00ff" opacity="0.1">‽</text>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#dmFloor)"/>
  <rect width="1920" height="1080" fill="url(#dmMatrix)"/>
  <!-- Espirais de confusão -->
  <g stroke="#ff00ff" fill="none" opacity="0.3" filter="url(#dmNeon)">
    <path d="M 960,540 Q 1060,440 960,340 Q 860,440 960,540" stroke-width="2"/>
    <path d="M 960,540 Q 860,640 960,740 Q 1060,640 960,540" stroke-width="2"/>
    <path d="M 960,540 Q 1160,540 1160,340 Q 960,340 960,540" stroke-width="1"/>
    <path d="M 960,540 Q 760,540 760,740 Q 960,740 960,540" stroke-width="1"/>
  </g>
  <!-- Círculos distorcidos -->
  <g opacity="0.4">
    <ellipse cx="960" cy="540" rx="300" ry="200" fill="none" stroke="#ff00ff" stroke-width="3" transform="rotate(5,960,540)" filter="url(#dmNeon)"/>
    <ellipse cx="960" cy="540" rx="250" ry="170" fill="none" stroke="#ff00ff" stroke-width="2" transform="rotate(-8,960,540)"/>
    <ellipse cx="960" cy="540" rx="200" ry="140" fill="none" stroke="#ff00ff" stroke-width="1" transform="rotate(12,960,540)"/>
  </g>
  <ellipse cx="960" cy="540" rx="350" ry="250" fill="url(#dmGlow)"/>
  <!-- Símbolos de interrogação gigantes -->
  <g fill="#ff00ff" opacity="0.1" font-family="serif" font-size="200">
    <text x="200" y="400">?</text>
    <text x="1600" y="400" transform="rotate(180,1700,300)">?</text>
    <text x="200" y="900">?</text>
    <text x="1600" y="900" transform="rotate(180,1700,800)">?</text>
  </g>
  <!-- Linhas quebradas -->
  <g stroke="#ff00ff" stroke-width="2" opacity="0.3">
    <polyline points="100,200 200,200 220,180 320,180 340,200 440,200" fill="none"/>
    <polyline points="1480,200 1580,200 1600,220 1700,220 1720,200 1820,200" fill="none"/>
    <polyline points="100,880 200,880 220,900 320,900 340,880 440,880" fill="none"/>
    <polyline points="1480,880 1580,880 1600,860 1700,860 1720,880 1820,880" fill="none"/>
  </g>
  <!-- Cantos glitchados -->
  <g fill="#ff00ff" opacity="0.5">
    <rect x="60" y="60" width="100" height="6"/><rect x="66" y="70" width="100" height="4"/>
    <rect x="60" y="60" width="6" height="100"/><rect x="70" y="66" width="4" height="100"/>
    <rect x="1760" y="60" width="100" height="6"/><rect x="1754" y="70" width="100" height="4"/>
    <rect x="1854" y="60" width="6" height="100"/><rect x="1846" y="66" width="4" height="100"/>
    <rect x="60" y="1014" width="100" height="6"/><rect x="66" y="1006" width="100" height="4"/>
    <rect x="60" y="920" width="6" height="100"/><rect x="70" y="914" width="4" height="100"/>
    <rect x="1760" y="1014" width="100" height="6"/><rect x="1754" y="1006" width="100" height="4"/>
    <rect x="1854" y="920" width="6" height="100"/><rect x="1846" y="914" width="4" height="100"/>
  </g>
  <text x="960" y="100" font-family="monospace" font-size="24" fill="#ff00ff" text-anchor="middle" opacity="0.5">ARENA 03: CHAOS CORE</text>
</svg>
